<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · electy.org</title>
<meta name="description" content="Contact electy.org: report an error, ask a question, suggest a race or feature, or reach us for press.">
<link rel="canonical" href="https://electy.org/contact/">
<meta property="og:title" content="Contact · electy.org">
<meta property="og:description" content="Contact electy.org: report an error, ask a question, suggest a race or feature, or reach us for press.">
<meta property="og:url" content="https://electy.org/contact/">
<meta property="og:site_name" content="electy.org">
<meta property="og:image" content="https://electy.org/img/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script src="../support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="alternate icon" type="image/png" href="../favicon.png">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  input:focus, textarea:focus{border-color:var(--gold) !important;}
  :root{
    --bg:#F6F4EF; --card:#FFFFFF; --ink:#23201A; --soft:#6B6455; --faint:#A39B89;
    --chipbg:#E8E3D8; --line:#ECE7DC;
    --gold:#B4832E; --goldbg:#F7ECD7; --bad:#B04A38;
    --shadow:0 6px 18px -12px rgba(35,32,26,.3);
  }
  [data-theme="dark"]{
    --bg:#15171C; --card:#212429; --ink:#F0EDE6; --soft:#A6AAB4; --faint:#6E7280;
    --chipbg:#2B2E35; --line:#2E323A;
    --gold:#D9B26A; --goldbg:#37301F; --bad:#E28B7B;
    --shadow:0 8px 22px -12px rgba(0,0,0,.6);
  }
</style>
</helmet>

<div data-theme="{{ theme }}" style="min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased; transition:background-color .25s ease, color .25s ease;">

  <div data-screen-label="Header" style="max-width:840px; margin:0 auto; padding:18px 20px 0; display:flex; align-items:center; justify-content:space-between; gap:12px;">
    <a href="../" style="display:flex; align-items:center; gap:9px; text-decoration:none; color:inherit;">
      <img src="../favicon.svg" alt="electy.org logo" style="width:26px; height:26px; display:block;">
      <span style="font-weight:800; font-size:17px; letter-spacing:-.01em;">electy<span style="color:var(--gold);">.org</span></span>
      <span style="font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--gold); background:var(--goldbg); padding:3px 8px; border-radius:999px;">BETA</span>
    </a>
    <div style="display:flex; align-items:center; gap:10px;">
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Toggle dark mode" style="width:38px; height:38px; border-radius:50%; border:none; background:var(--card); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; box-shadow:var(--shadow);">
        <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="2" x2="12" y2="4.5"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="2" y1="12" x2="4.5" y2="12"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="4.9" y1="4.9" x2="6.6" y2="6.6"></line><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"></line><line x1="4.9" y1="19.1" x2="6.6" y2="17.4"></line><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"></line></svg>
        </sc-if>
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path></svg>
        </sc-if>
      </button>
    </div>
  </div>

  <div style="max-width:560px; margin:0 auto; padding:48px 20px 80px; text-align:center;">
    <div style="display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--gold); background:var(--goldbg); padding:4px 10px; border-radius:999px; margin-bottom:16px;">BETA</div>
    <h1 style="font-weight:800; font-size:clamp(26px,5vw,34px); line-height:1.15; letter-spacing:-.02em; margin:0 0 12px;">Contact us</h1>
    <p style="font-size:14px; line-height:1.6; color:var(--soft); margin:0 0 24px; text-wrap:pretty;">Questions, ideas, press, or something on a page that looks wrong. Pick a subject and we'll take it from there.</p>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" style="background:var(--card); border-radius:22px; padding:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;">
        <div role="radiogroup" aria-label="Subject" style="display:flex; flex-direction:column; gap:8px; text-align:left;">
          <span style="font-size:12.5px; font-weight:700; color:var(--soft);">Subject</span>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{ subjects }}" as="s" hint-placeholder-count="5">
              <button type="button" role="radio" aria-checked="{{ s.on }}" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.label }}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{ isError }}" hint-placeholder-val="{{ true }}">
        <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--soft); text-align:left;">Which page?
          <input type="text" name="page" value="{{ page }}" onChange="{{ setPage }}" placeholder="e.g. electy.org/senate/michigan" style="width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none;">
        </label>
        </sc-if>
        <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--soft); text-align:left;">{{ messageLabel }}
          <textarea name="message" required="" rows="5" value="{{ message }}" onChange="{{ setMessage }}" placeholder="{{ messagePlaceholder }}" style="width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none; resize:vertical;"></textarea>
        </label>
        <sc-if value="{{ isError }}" hint-placeholder-val="{{ true }}">
        <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--soft); text-align:left;">Source (optional)
          <input type="url" name="source" value="{{ source }}" onChange="{{ setSource }}" placeholder="https://" style="width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none;">
        </label>
        </sc-if>
        <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--soft); text-align:left;">{{ emailLabel }}
          <input type="email" name="email" required="{{ emailRequired }}" value="{{ email }}" onChange="{{ setEmail }}" placeholder="you@example.com" style="width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none;">
        </label>
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <p style="font-size:12.5px; color:var(--bad); margin:0; text-align:left;">{{ error }}</p>
        </sc-if>
        <button type="submit" disabled="{{ sending }}" style="border:none; cursor:pointer; background:var(--ink); color:var(--bg); font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:800; padding:14px 22px; border-radius:14px;">{{ buttonLabel }}</button>
      </form>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="background:var(--card); border-radius:22px; padding:28px 22px; box-shadow:var(--shadow);">
        <div style="font-weight:800; font-size:17px; margin-bottom:6px;">Thanks, we've got it.</div>
        <p style="font-size:13.5px; line-height:1.6; color:var(--soft); margin:0;">{{ thanks }}</p>
      </div>
    </sc-if>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
// Form backend. Paste the endpoint from Formspree (https://formspree.io/f/xxxx) or any
// service that accepts a JSON POST. Until it is set, the form explains it isn't connected.
const FORM_ENDPOINT = 'https://formspree.io/f/xwlpqwvg';

const SUBJECTS = [
  { id: 'error', label: 'Report an error', msg: "What's wrong?", ph: 'What the page says, and what it should say', thanks: "We'll check it against the source and fix the page if it's wrong." },
  { id: 'question', label: 'Question', msg: 'Your question', ph: 'What would you like to know?', thanks: "We'll reply to the email you gave." },
  { id: 'suggestion', label: 'Suggestion', msg: 'Your suggestion', ph: 'A race to cover, a feature, anything', thanks: 'We read every suggestion.' },
  { id: 'press', label: 'Press', msg: 'Message', ph: 'Your outlet and what you need', thanks: "We'll reply to the email you gave." },
  { id: 'other', label: 'Other', msg: 'Message', ph: '', thanks: "We'll get back to you if a reply is needed." },
];

class Component extends DCLogic {
  state = {
    theme: (function(){ try { return localStorage.getItem('electy-theme') || 'light'; } catch(e){ return 'light'; } })(),
    page: (function(){ try { const q = new URLSearchParams(location.search).get('page'); if (q) return q; const r = document.referrer; return r && r.indexOf(location.host) !== -1 && !/contact/.test(r) ? r : ''; } catch(e){ return ''; } })(),
    subject: (function(){ try { const q = new URLSearchParams(location.search).get('subject'); if (q && SUBJECTS.some(s => s.id === q)) return q; return new URLSearchParams(location.search).get('page') ? 'error' : 'question'; } catch(e){ return 'question'; } })(),
    message: '', source: '', email: '', sending: false, sent: false, error: '',
  };

  submit = (e) => {
    e.preventDefault();
    const sub = SUBJECTS.find(s => s.id === this.state.subject) || SUBJECTS[0];
    if (!this.state.message.trim()) { this.setState({ error: 'Please write a message.' }); return; }
    if (this.needsEmail() && !this.state.email.trim()) { this.setState({ error: 'Please add your email so we can reply.' }); return; }
    if (!FORM_ENDPOINT) { this.setState({ error: 'The report form is not connected yet.' }); return; }
    this.setState({ sending: true, error: '' });
    const { page, message, source, email } = this.state;
    const isErr = sub.id === 'error';
    const body = { subject: sub.label, message, email, _subject: 'electy.org: ' + sub.label };
    if (email) body._replyto = email;
    if (isErr) { body.page = page; body.source = source; }
    fetch(FORM_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(r => { if (!r.ok) throw new Error(); this.setState({ sent: true, sending: false }); })
      .catch(() => this.setState({ sending: false, error: 'Something went wrong sending that. Please try again.' }));
  };

  needsEmail() { return this.state.subject === 'question' || this.state.subject === 'press'; }

  renderVals(){
    const theme = this.state.theme;
    const cur = SUBJECTS.find(s => s.id === this.state.subject) || SUBJECTS[0];
    const chip = on => 'border:1.5px solid ' + (on ? 'var(--ink)' : 'var(--line)') + '; background:' + (on ? 'var(--ink)' : 'var(--bg)') + '; color:' + (on ? 'var(--bg)' : 'var(--ink)') + "; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700; padding:9px 14px; border-radius:999px; cursor:pointer; min-height:40px;";
    const set = k => e => this.setState({ [k]: e.target.value });
    return {
      theme,
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      toggleTheme: () => this.setState(s => { const t = s.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('electy-theme', t); } catch(e){} return { theme: t }; }),
      page: this.state.page, message: this.state.message, source: this.state.source, email: this.state.email,
      setPage: set('page'), setMessage: set('message'), setSource: set('source'), setEmail: set('email'),
      submit: this.submit,
      subjects: SUBJECTS.map(s => ({ label: s.label, on: s.id === cur.id, style: chip(s.id === cur.id), pick: () => this.setState({ subject: s.id, error: '' }) })),
      isError: cur.id === 'error',
      messageLabel: cur.msg, messagePlaceholder: cur.ph, thanks: cur.thanks,
      emailRequired: this.needsEmail(),
      emailLabel: this.needsEmail() ? 'Your email' : "Your email (optional, if you'd like a reply)",
      sending: this.state.sending,
      buttonLabel: this.state.sending ? 'Sending…' : (cur.id === 'error' ? 'Send report' : 'Send message'),
      sent: this.state.sent, notSent: !this.state.sent,
      hasError: !!this.state.error, error: this.state.error,
    };
  }
}
</script>
</body>
</html>
